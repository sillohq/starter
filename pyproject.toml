[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starter"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sillo-framework[cache,hashing-bcrypt,jwt,record,templating]>=0.0.1a5",
    "email-validator>=2.0.0",
    # The SQLite driver. Swap for asyncpg or asyncmy when you change DATABASE_URL.
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "httpx>=0.28.1",
    "coverage[toml]>=7.4.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are written by the migration engine, not by you. Linting them only
# ever means reformatting generated code, and `make check` would fail the first
# time you add a model.
extend-exclude = ["database/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# Migrations need no configuration of their own: `python console.py db ...`
# reads app/database.py, the same settings the application runs on.
