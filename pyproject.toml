[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starter"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sillo-framework[cache,hashing-bcrypt,jwt,record,templating]>=0.0.1a4",
    "tortoise-orm>=1.0",
    "email-validator>=2.0.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "httpx>=0.28.1",
    "coverage[toml]>=7.4.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# Migrations are Tortoise-native; the config lives in database/config.py and
# the migration package is declared there under apps.models.migrations.
