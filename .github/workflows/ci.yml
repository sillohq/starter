name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the failure this catches is a new sillo release breaking
  # the starter — which happens on their calendar, not on ours.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Apply migrations
        run: |
          cp .env.example .env
          make migrate

      # The reason this repository exists. A generated project can render
      # perfectly and still fail on the first request, so CI runs the app
      # rather than only checking that the files were written.
      - name: Test
        run: uv run pytest -q

      - name: Create an administrator
        env:
          ADMIN_PASSWORD: Ci-password1!
        run: uv run sillo user:admin ci@example.com ci

      - name: Boot the application
        run: uv run python scripts/smoke.py
